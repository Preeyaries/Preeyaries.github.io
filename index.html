*{box-sizing:border-box}
html,body{margin:0}

.cols{display:grid;grid-template-columns:230px 1fr;gap:0 30px;margin-top:26px}

.side h2,.main h2{font-family:"League Spartan",Lato,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:17px;color:var(--navy);margin:0}
.side section{margin-bottom:26px}

.clist{display:grid;gap:9px;margin:0;padding:0;list-style:none;font-size:13px}

.sk{display:grid;gap:10px}

.sk-items{margin:1px 0 0;font-size:12.8px;color:var(--ink)}
.c-dates{color:var(--muted);font-size:12px}
.bul{margin:0;padding-left:16px;font-size:13px;display:grid;gap:5px}

.main{position:relative;padding-left:44px}
.main::before{content:"";position:absolute;left:12px;top:14px;bottom:6px;width:1.5px;background:var(--navy)}
@media (max-width:700px){.main{padding-left:38px}}

.main .icon svg{width:14px;height:14px;fill:#fff}

.profile{margin:0;font-size:13.3px;text-align:justify;hyphens:auto}

.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;align-items:baseline}
.e-title{font-weight:700;font-size:14px;color:var(--navy)}

.pts{margin:6px 0 0;padding-left:18px;font-size:13px;display:grid;gap:3px;text-align:justify}
.desc{margin:6px 0 0;font-size:13px}
.del{position:absolute;top:-4px;right:-6px;padding:2px 7px;font-size:12px;line-height:1.2;color:var(--muted);background:var(--paper);transform:translateX(100%)}
@media (max-width:980px){.del{transform:none;right:0;top:-22px}}
.add{margin-top:10px;font-size:12.5px;padding:5px 10px;color:var(--navy);border-style:dashed;border-color:var(--edit-ring);background:transparent}
.editing [data-k]{border-radius:3px;background:var(--edit-fill);box-shadow:0 0 0 1px var(--edit-ring);cursor:text;min-width:1ch;display:inline-block}
.editing p[data-k],.editing div[data-k]{display:block}
[data-k]:empty::before{content:attr(data-ph);color:#9aa4ae}
.hide-empty:empty{display:none}
.editing .hide-empty:empty{display:inline-block}
</style>

    /* right column with timeline */
    h += '<div class="main">';
    h += '<section><span class="icon">' + ICON.person + '</span><h2>Profile</h2>' + f('p', 'summary', 'profile', 'Short professional summary') + '</section>';

    h += '<section><span class="icon">' + ICON.cap + '</span><h2>Education</h2><div class="entries">';
    state.education.forEach(function(e, i){
      h += '<div class="entry">';
      h += '<div class="row">' + f('span', 'education.' + i + '.degree', 'e-title', 'Degree') + f('span', 'education.' + i + '.dates', 'e-when hide-empty', 'Years') + '</div>';
      h += f('div', 'education.' + i + '.school', 'e-sub', 'School');
      h += f('p', 'education.' + i + '.note', 'desc hide-empty', 'Optional note');
      h += delBtn('education', i, 'Remove education');
      h += '</div>';
    });
    h += '</div>' + addBtn('education', 'Add education') + '</section>';
    h += entrySection('Industry Project', ICON.handshake, 'industry', 'Add industry project');
    h += entrySection('Projects', ICON.case, 'projects', 'Add project');

    h += '</div>';

    h += '</div></article></div>';
    root.innerHTML = h;
    setStatus();
    wire();
  }

  function setStatus(msg, kind){
    var el = document.getElementById('status');
    if (!el) return;
    if (msg){el.textContent = msg;el.className = 'status' + (kind ? ' ' + kind : '');return;}
    if (!canEdit){el.textContent = '';el.className = 'status';}
    else if (readOnly){el.textContent = 'View only';el.className = 'status';}
    else if (dirty){el.textContent = 'Unsaved changes';el.className = 'status warn';}
    else {el.textContent = '';el.className = 'status';}
  }

  function markDirty(){if (!dirty){dirty = true;var b = document.getElementById('btn-save');if (b && !readOnly) b.disabled = false;setStatus();}}

  function wire(){
    if (canEdit){
      document.getElementById('btn-edit').onclick = function(){editing = !editing;render();};
      document.getElementById('btn-save').onclick = save;
    }
    document.getElementById('btn-pdf').onclick = downloadPdf;
    root.querySelectorAll('[data-k][contenteditable]').forEach(function(el){
      el.addEventListener('input', function(){setPath(el.getAttribute('data-k'), el.textContent.replace(/\s+/g, ' ').trim());markDirty();});
      el.addEventListener('keydown', function(ev){if (ev.key === 'Enter'){ev.preventDefault();el.blur();}});
      el.addEventListener('paste', function(ev){
        ev.preventDefault();
        var t = (ev.clipboardData || window.clipboardData).getData('text/plain').replace(/\s+/g, ' ');
        document.execCommand('insertText', false, t);
      });
    });
    root.querySelectorAll('[data-del]').forEach(function(b){
      b.onclick = function(){state[b.getAttribute('data-del')].splice(+b.getAttribute('data-i'), 1);dirty = true;render();};
    });
    root.querySelectorAll('[data-add]').forEach(function(b){
      b.onclick = function(){
        var k = b.getAttribute('data-add');
        if (k === 'education') state.education.push({school: '', degree: '', dates: '', note: ''});
        if (k === 'projects') state.projects.push({name: '', context: '', sub: '', tech: '', desc: ''});
        if (k === 'skills') state.skills.push({label: '', items: ''});
        if (k === 'languages') state.languages.push({text: ''});
        if (k === 'community') state.community.push({role: '', org: '', dates: ''});
        if (k === 'industry') state.industry.push({name: '', context: '', sub: '', tech: '', desc: ''});
        dirty = true;render();
      };
    });
  }

  function buildDocument(){
    var css = document.getElementById('resume-css').textContent;
    var js = document.getElementById('resume-app').textContent;
    var data = JSON.stringify(state, null, 2).replace(/</g, '\\u003c');
    var S = 'script';
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
      '<title>' + esc(document.title || 'Resume') + '</title>' +
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap">' +
      '<style id="resume-css">' + css + '</style></head><body>\n<div id="root"></div>\n' +
      '<' + S + ' src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></' + S + '>\n' +
      '<' + S + ' type="application/json" id="resume-data">\n' + data + '\n</' + S + '>\n' +
      '<' + S + ' id="resume-app">' + js + '</' + S + '>\n</body></html>';
  }

  function save(){
    if (!dirty || readOnly) return;
    if (!artifactApi){setStatus('Saving is not available in this view', 'warn');return;}
    var b = document.getElementById('btn-save');
    if (b) b.disabled = true;
    setStatus('Saving…');
    artifactApi.publish(buildDocument()).then(function(){dirty = false;setStatus('Saved', 'ok');}).catch(function(err){
      var code = err && err.code;
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared' || code === 'capability_disabled'){
        readOnly = true;setStatus('View only. Your edits stay on this screen but cannot be saved.', 'warn');
      } else if (code === 'conflict'){setStatus('A newer version was saved elsewhere. Reloading…', 'warn');}
      else if (code === 'rate_limited'){setStatus('Saving too often. Wait a moment and try again.', 'warn');if (b) b.disabled = false;}
      else {setStatus('Could not save. Try again.', 'warn');if (b) b.disabled = false;}
    });
  }

  /* ---------- PDF: same two-column layout, real text ---------- */
  function clean(s){
    return String(s || '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...').replace(/ /g, ' ')
      .replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ–—•]/g, '');
  }

  function makePdf(){
    var J = window.jspdf && window.jspdf.jsPDF;
    if (!J) throw new Error('nolib');
    var doc = new J({unit: 'pt', format: 'a4'});
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    var M = 40, TOPM = 36, BOT = 34;
    var NAVY = [43, 52, 69], INK = [42, 51, 66], MUTED = [94, 104, 120];
    var LX = M, LW = 150, GAP = 22;
    var TL = LX + LW + GAP + 10;            /* timeline x */
    var RX = TL + 22, RW = W - M - RX;      /* right column */

    function col(c){doc.setTextColor(c[0], c[1], c[2]);}
    function fill(c){doc.setFillColor(c[0], c[1], c[2]);}
    function draw(c){doc.setDrawColor(c[0], c[1], c[2]);}

    /* header */
    var y = TOPM;
    doc.setFont('helvetica', 'bold');doc.setFontSize(28);col(NAVY);
    doc.text(clean(state.name).toUpperCase(), M, y + 24, {charSpace: 0.6});
    y += 42;
    doc.setFont('helvetica', 'normal');doc.setFontSize(12);col(INK);
    doc.text(clean(state.role).toUpperCase(), M, y, {charSpace: 0.8});
    y += 14;
    draw(NAVY);doc.setLineWidth(1.4);doc.line(M, y, W - M, y);
    var bodyTop = y + 24;

    /* ---- left column (page 1) ---- */
    var ly = bodyTop;
    function lHead(t){
      doc.setFont('helvetica', 'bold');doc.setFontSize(12);col(NAVY);
      doc.text(clean(t).toUpperCase(), LX, ly + 11, {charSpace: 1.4});
      ly += 18;draw(NAVY);doc.setLineWidth(1);doc.line(LX, ly, LX + LW, ly);ly += 10;
    }
    function lText(t, size, style, c, indent){
      t = clean(t);if (!t) return;
      doc.setFont('helvetica', style || 'normal');doc.setFontSize(size);col(c || INK);
      var lines = doc.splitTextToSize(t, LW - (indent || 0));
      lines.forEach(function(line){doc.text(line, LX + (indent || 0), ly + size);ly += size * 1.35;});
    }
    function glyph(kind, x, cy){
      fill(NAVY);
      if (kind === 'phone'){doc.roundedRect(x + 1.5, cy - 4.5, 5, 9, 1.2, 1.2, 'F');}
      else if (kind === 'mail'){doc.rect(x, cy - 3.2, 8, 6, 'F');}
      else if (kind === 'pin'){doc.circle(x + 4, cy - 1, 3, 'F');doc.triangle(x + 1.3, cy, x + 6.7, cy, x + 4, cy + 4.5, 'F');}
      else {doc.circle(x + 4, cy, 3.6, 'F');}
    }
    lHead('Contact');
    [['phone', state.phone], ['mail', state.email], ['pin', state.location], ['link', state.linkedin], ['code', state.github]].forEach(function(r){
      var v = clean(r[1]);if (!v) return;
      doc.setFont('helvetica', 'normal');doc.setFontSize(8.6);col(INK);
      var lines = doc.splitTextToSize(v, LW - 16);
      glyph(r[0], LX, ly + 5.5);
      lines.forEach(function(line, i){doc.text(line, LX + 16, ly + 8.6 + i * 11);});
      ly += 11 * lines.length + 6;
    });
    ly += 12;
    lHead('Skills');
    state.skills.forEach(function(s){
      if (!clean(s.label) && !clean(s.items)) return;
      lText(s.label, 8.8, 'bold', NAVY);
      lText(s.items, 8.6, 'normal', INK);
      ly += 5;
    });
    ly += 10;
    if (state.languages.some(function(l){return clean(l.text);})){
      lHead('Languages');
      state.languages.forEach(function(l){
        var t = clean(l.text);if (!t) return;
        fill(INK);doc.circle(LX + 2.5, ly + 5.6, 1.3, 'F');
        doc.setFont('helvetica', 'normal');doc.setFontSize(8.8);col(INK);doc.text(t, LX + 10, ly + 8.8);ly += 13;
      });
    }
    if (state.community.some(function(c){return clean(c.role) || clean(c.org);})){
      ly += 12;
      lHead('Community');
      state.community.forEach(function(c){
        if (!clean(c.role) && !clean(c.org)) return;
        lText(c.role, 8.8, 'bold', NAVY);
        lText(c.org, 8.6, 'normal', INK);
        if (clean(c.dates)) lText(c.dates, 8.2, 'normal', MUTED);
        ly += 5;
      });
    }

    /* ---- right column with timeline, flows across pages ---- */
    var y2 = bodyTop, pageTop = bodyTop, page = 1;
    var segs = [];
    function newPage(){segs.push([page, pageTop, H - BOT]);doc.addPage();page++;y2 = TOPM + 6;pageTop = TOPM;}
    function need(h){if (y2 + h > H - BOT) newPage();}
    function rText(t, size, style, c, indent, justify){
      t = clean(t);if (!t) return;
      doc.setFont('helvetica', style || 'normal');doc.setFontSize(size);col(c || INK);
      var w = RW - (indent || 0);
      var lines = doc.splitTextToSize(t, w), lh = size * 1.38;
      lines.forEach(function(line, i){
        need(lh);
        var opts = (justify && i < lines.length - 1) ? {maxWidth: w, align: 'justify'} : {};
        doc.text(line, RX + (indent || 0), y2 + size, opts);
        y2 += lh;
      });
    }
    var marks = [];
    function icon(kind, cy){marks.push({pg: page, t: 'icon', kind: kind, cy: cy});}
    function dot(cy){marks.push({pg: page, t: 'dot', cy: cy});}
    function drawIcon(kind, cy){
      fill(NAVY);doc.circle(TL, cy, 9, 'F');
      doc.setFillColor(255, 255, 255);
      if (kind === 'person'){doc.circle(TL, cy - 2.4, 2.4, 'F');doc.ellipse(TL, cy + 4, 4.4, 2.6, 'F');fill(NAVY);doc.rect(TL - 5, cy + 4.2, 10, 3, 'F');}
      else if (kind === 'build'){doc.rect(TL - 4.5, cy - 2, 9, 6.5, 'F');doc.triangle(TL - 5, cy - 1.6, TL + 5, cy - 1.6, TL, cy - 5.2, 'F');}
      else if (kind === 'case'){doc.rect(TL - 4.6, cy - 2.2, 9.2, 6.2, 'F');doc.rect(TL - 2, cy - 4.2, 4, 1.6, 'F');}
      else {doc.triangle(TL - 5.5, cy - 0.6, TL + 5.5, cy - 0.6, TL, cy - 4.4, 'F');doc.triangle(TL - 5.5, cy - 0.6, TL + 5.5, cy - 0.6, TL, cy + 2.8, 'F');doc.rect(TL - 3, cy + 0.6, 6, 3.4, 'F');}
    }
    function rHead(t, kind){
      need(46);
      icon(kind, y2 + 7);
      doc.setFont('helvetica', 'bold');doc.setFontSize(12.5);col(NAVY);
      doc.text(clean(t).toUpperCase(), RX, y2 + 12, {charSpace: 1.4});
      y2 += 19;draw(NAVY);doc.setLineWidth(1);doc.line(RX, y2, RX + RW, y2);y2 += 9;
    }
    function drawDot(cy){doc.setFillColor(255, 255, 255);draw(NAVY);doc.setLineWidth(1);doc.circle(TL, cy, 2.8, 'FD');}
    function rowLR(left, right, size){
      left = clean(left);right = clean(right);
      doc.setFontSize(size);doc.setFont('helvetica', 'normal');
      var rw = right ? doc.getTextWidth(right) : 0;
      doc.setFont('helvetica', 'bold');
      var lines = doc.splitTextToSize(left, RW - rw - (right ? 12 : 0)), lh = size * 1.32;
      need(lh * lines.length + 12);
      dot(y2 + size * 0.62);
      col(NAVY);
      lines.forEach(function(line, i){doc.text(line, RX, y2 + size + i * lh);});
      if (right){doc.setFont('helvetica', 'normal');col(INK);doc.text(right, RX + RW, y2 + size, {align: 'right'});}
      y2 += lh * lines.length;
    }
    function bullets(text){
      sentences(clean(text)).forEach(function(s){
        doc.setFont('helvetica', 'normal');doc.setFontSize(8.9);
        var lines = doc.splitTextToSize(s, RW - 12), lh = 8.9 * 1.36;
        need(lh);
        fill(INK);doc.circle(RX + 4, y2 + 5.8, 1.2, 'F');
        col(INK);
        lines.forEach(function(line, i){
          need(lh);
          var opts = i < lines.length - 1 ? {maxWidth: RW - 12, align: 'justify'} : {};
          doc.text(line, RX + 12, y2 + 8.9, opts);y2 += lh;
        });
        y2 += 1;
      });
    }

    if (clean(state.summary)){rHead('Profile', 'person');rText(state.summary, 9.2, 'normal', INK, 0, true);y2 += 10;}

    function entries(title, kind, list){
      if (!list.length) return;
      rHead(title, kind);
      list.forEach(function(p, i){
        if (i) y2 += 5;
        rowLR(p.name, p.context, 10);
        if (clean(p.sub)) rText(p.sub, 9.3, 'normal', INK);
        if (clean(p.tech)) rText(p.tech, 8.4, 'italic', MUTED);
        y2 += 2;
        bullets(p.desc);
      });
      y2 += 10;
    }

    if (state.education.length){
      rHead('Education', 'cap');
      state.education.forEach(function(e, i){
        if (i) y2 += 5;
        rowLR(e.degree, e.dates, 10);
        rText(e.school, 9.3, 'normal', INK);
        if (clean(e.note)) rText(e.note, 8.6, 'normal', MUTED);
      });
    }
    y2 += 10;
    entries('Industry Project', 'build', state.industry);
    entries('Projects', 'case', state.projects);

    segs.push([page, pageTop, y2 + 4]);

    /* draw timeline lines under the icons */
    segs.forEach(function(sg){
      doc.setPage(sg[0]);draw(NAVY);doc.setLineWidth(1);
      doc.line(TL, sg[1] + (sg[0] === 1 ? 16 : 0), TL, sg[2]);
    });
    /* markers go on top of the line */
    marks.forEach(function(m){
      doc.setPage(m.pg);
      if (m.t === 'icon') drawIcon(m.kind, m.cy); else drawDot(m.cy);
    });
    var n = doc.getNumberOfPages();
    for (var pg = 1; pg <= n; pg++){
      doc.setPage(pg);doc.setFont('helvetica', 'normal');doc.setFontSize(7.5);col(MUTED);
      doc.text(clean(state.name) + '  ·  ' + pg + ' / ' + n, W - M, H - 20, {align: 'right'});
    }
    return doc;
  }

  function fileName(){
    var base = clean(state.name).replace(/\([^)]*\)/g, '').trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9-]/g, '');
    return (base || 'Resume') + '-Resume.pdf';
  }

  function downloadPdf(){
    var doc;
    try {doc = makePdf();}
    catch (e){setStatus('PDF tools did not load. Refresh the page and try again.', 'warn');return;}
    if (!downloadsApi){
      if (!(window.claude && typeof window.claude.use === 'function')){doc.save(fileName());setStatus('PDF saved', 'ok');return;}
      setStatus('Downloads are not available in this view', 'warn');return;
    }
    setStatus('Preparing PDF…');
    downloadsApi.save({filename: fileName(), data: doc.output('blob')}).then(function(){setStatus('PDF saved', 'ok');}).catch(function(err){
      var code = err && err.code;
      if (code === 'declined') setStatus();
      else if (code === 'rate_limited') setStatus('A save prompt is already open', 'warn');
      else setStatus('Download is not available here', 'warn');
    });
  }

  render();

  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('user').then(function(u){
      if (!u) return false;
      return u.canEdit();
    }).then(function(ok){
      if (ok === true && !canEdit){canEdit = true;render();}
    }).catch(function(){});
    window.claude.use('artifact').then(function(a){artifactApi = a;if (!a){readOnly = true;setStatus();var b = document.getElementById('btn-save');if (b) b.disabled = true;}}).catch(function(){});
    window.claude.use('downloads').then(function(d){downloadsApi = d;}).catch(function(){});
  } else {readOnly = true;setStatus();}
})();
</script>
